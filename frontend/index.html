<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mandados Express - Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* Soporte para notch y barra de navegación de Android */
    .safe-top { padding-top: max(1.25rem, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
    
    /* Ocultar zoom redundante en pantalla táctil */
    .leaflet-control-zoom { display: none !important; }
    .leaflet-control-attribution { font-size: 8px !important; opacity: 0.5; }
    #mapa { height: 190px; border-radius: 1rem; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex justify-center selection:bg-indigo-500 selection:text-white">

  <!-- MODAL DE LOGIN / REGISTRO -->
  <div id="modalAuth" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-5">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
      <div class="text-center space-y-1">
        <div class="inline-flex p-3 bg-indigo-50 text-indigo-600 rounded-2xl mb-1">
          <i data-lucide="shopping-bag" class="w-6 h-6"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-900" id="authTitulo">Iniciar Sesión</h3>
        <p class="text-xs text-slate-500">Villa de Tezontepec - Mandados Express</p>
      </div>

      <div id="authError" class="hidden p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-600 text-center font-medium"></div>

      <form id="formAuth" onsubmit="procesarAuth(event)" class="space-y-3">
        <div id="campoNombre" class="hidden">
          <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Nombre Completo</label>
          <input type="text" id="authNombre" placeholder="Tu nombre" class="w-full px-3.5 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Teléfono (10 dígitos)</label>
          <input type="tel" id="authTelefono" required placeholder="7711234567" maxlength="10" class="w-full px-3.5 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none font-medium" />
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Contraseña</label>
          <input type="password" id="authPassword" required placeholder="••••••••" class="w-full px-3.5 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none font-medium" />
        </div>

        <button type="submit" id="btnAuth" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-2">
          <span>Ingresar</span>
        </button>
      </form>

      <div class="text-center pt-1">
        <button type="button" onclick="alternarModoAuth()" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold" id="btnToggleAuth">
          ¿No tienes cuenta? Regístrate aquí
        </button>
      </div>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-xl">
    
    <!-- Header adaptado al Notch -->
    <header class="bg-indigo-600 text-white px-5 pb-4 safe-top flex justify-between items-center shadow-md">
      <div class="flex items-center gap-2.5">
        <div class="bg-white/10 p-2 rounded-xl backdrop-blur-sm">
          <i data-lucide="package" class="w-5 h-5 text-indigo-100"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm leading-tight tracking-tight">Mandados Express</h1>
          <span class="text-[11px] text-indigo-200 font-medium" id="headerUsuario">Cargando...</span>
        </div>
      </div>
      <button onclick="cerrarSesion()" class="text-xs bg-white/15 hover:bg-white/25 active:scale-95 text-white px-3 py-1.5 rounded-xl font-medium transition border border-white/20">
        Salir
      </button>
    </header>

    <main class="flex-1 p-4 space-y-4 overflow-y-auto safe-bottom">
      
      <!-- Tarjeta del Pedido -->
      <section class="bg-slate-50/80 border border-slate-200 rounded-3xl p-4 shadow-sm space-y-3.5">
        
        <form id="formMandado" onsubmit="enviarPedido(event)" class="space-y-3.5">
          
          <!-- Descripción -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
              <i data-lucide="edit-3" class="w-3.5 h-3.5 text-indigo-600"></i>
              ¿Qué necesitas que compren o lleven?
            </label>
            <textarea id="descripcion" required rows="2" placeholder="Ej. 1kg de barbacoa de la plaza, tortillas y una Coca de 2L..."
              class="w-full p-3 text-xs bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none shadow-sm"></textarea>
          </div>

          <!-- Mapa Interactivo estilo Uber/Rappi con Pin Central -->
          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-rose-500"></i>
                ¿Dónde te lo entregamos?
              </label>
              <button type="button" onclick="obtenerMiUbicacion()" class="text-[11px] text-indigo-600 font-bold flex items-center gap-1 bg-indigo-50 px-2 py-0.5 rounded-lg active:scale-95 transition">
                <i data-lucide="crosshair" class="w-3 h-3"></i> Mi ubicación
              </button>
            </div>

            <!-- Contenedor del Mapa con Aguja Flotante -->
            <div class="relative overflow-hidden rounded-2xl border border-slate-200 shadow-sm">
              <div id="mapa" class="w-full"></div>

              <!-- Pin Fijo en el Centro -->
              <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-[400] pb-5">
                <div class="flex flex-col items-center">
                  <span class="bg-slate-900/90 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-lg mb-1">
                    Entrega aquí
                  </span>
                  <i data-lucide="map-pin" class="w-7 h-7 text-rose-500 drop-shadow-md fill-rose-500"></i>
                </div>
              </div>
            </div>
            <p class="text-[10px] text-slate-400 mt-1 text-center font-medium">Mueve el mapa para colocar el pin en tu casa o negocio</p>
          </div>

          <!-- Referencia de Entrega -->
          <div>
            <input type="text" id="destino_ref" required placeholder="Calle, número, fachada o referencia de entrega..." 
              class="w-full px-3.5 py-2.5 text-xs bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:outline-none shadow-sm font-medium" />
          </div>

          <!-- Dinero para Productos con Botones Rápidos -->
          <div class="p-3 bg-white border border-slate-200 rounded-2xl space-y-2 shadow-sm">
            <div class="flex justify-between items-center">
              <label class="block text-[11px] font-bold text-slate-700">Dinero para compras:</label>
              <div class="relative w-28">
                <span class="absolute left-2.5 top-1.5 text-xs font-bold text-slate-400">$</span>
                <input type="number" id="costo_productos" min="0" step="1.0" value="0.00" oninput="actualizarCalculos()" 
                  class="w-full pl-6 pr-2 py-1 text-xs bg-slate-50 border border-slate-200 rounded-lg text-right font-bold focus:outline-none focus:ring-1 focus:ring-indigo-500" />
              </div>
            </div>

            <!-- Chips de acceso rápido -->
            <div class="grid grid-cols-4 gap-1.5 pt-0.5">
              <button type="button" onclick="setMonto(0)" class="py-1 text-[10px] font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition active:scale-95">$0 (Envío)</button>
              <button type="button" onclick="setMonto(50)" class="py-1 text-[10px] font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition active:scale-95">$50</button>
              <button type="button" onclick="setMonto(100)" class="py-1 text-[10px] font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition active:scale-95">$100</button>
              <button type="button" onclick="setMonto(200)" class="py-1 text-[10px] font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition active:scale-95">$200</button>
            </div>
          </div>

          <!-- Selector de Método de Pago Táctil -->
          <div class="space-y-1.5">
            <label class="block text-[11px] font-bold text-slate-700">Forma de pago al repartidor:</label>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" id="btnPagoEfectivo" onclick="setMetodoPago('efectivo')" 
                class="py-2 px-3 text-xs font-bold rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-900 flex items-center justify-center gap-1.5 transition">
                <i data-lucide="banknote" class="w-4 h-4"></i> Efectivo
              </button>
              <button type="button" id="btnPagoSPEI" onclick="setMetodoPago('transferencia')" 
                class="py-2 px-3 text-xs font-medium rounded-xl border border-slate-200 bg-white text-slate-600 flex items-center justify-center gap-1.5 transition">
                <i data-lucide="smartphone" class="w-4 h-4"></i> SPEI / Transf.
              </button>
            </div>
          </div>

          <!-- Resumen tipo Ticket -->
          <div class="bg-indigo-50/70 border border-indigo-100 rounded-2xl p-3 text-xs space-y-1">
            <div class="flex justify-between text-slate-600">
              <span>Tarifa de servicio de envío:</span>
              <span class="font-semibold text-slate-800">$35.00</span>
            </div>
            <div class="flex justify-between text-slate-600">
              <span>Productos a pagar en tienda:</span>
              <span id="lblResumenProductos" class="font-semibold text-slate-800">$0.00</span>
            </div>
            <div class="flex justify-between font-extrabold text-sm text-indigo-950 border-t border-indigo-200/80 pt-1.5 mt-1">
              <span>Total a pagar:</span>
              <span id="lblResumenTotal" class="text-indigo-600">$35.00</span>
            </div>
          </div>

          <!-- Botón de Envío -->
          <button type="submit" id="btnSubmit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-extrabold text-xs rounded-2xl shadow-lg shadow-indigo-200 transition flex items-center justify-center gap-2">
            <i data-lucide="send" class="w-4 h-4"></i>
            <span>Pedir Mandado</span>
          </button>
        </form>
      </section>

      <!-- Pedidos Activos -->
      <section class="space-y-2.5">
        <h2 class="font-bold text-slate-800 text-xs flex items-center gap-1.5">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-indigo-600"></i> Tus pedidos
        </h2>
        <div id="contenedorPedidos" class="space-y-2.5"></div>
      </section>
    </main>
  </div>

  <script>
    const API_BASE = "http://192.168.1.11:8000";
    let usuarioActual = null;
    let modoRegistro = false;
    let metodoPagoSeleccionado = "efectivo";

    // --- AUTENTICACIÓN ---
    function mostrarErrorAuth(msg) {
      const el = document.getElementById("authError");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    function ocultarErrorAuth() {
      document.getElementById("authError").classList.add("hidden");
    }

    function checkSesion() {
      const sesion = localStorage.getItem("sesion_usuario");
      if (sesion) {
        usuarioActual = JSON.parse(sesion);
        document.getElementById("modalAuth").classList.add("hidden");
        document.getElementById("headerUsuario").innerText = usuarioActual.nombre + " (" + usuarioActual.telefono + ")";
        cargarPedidos();
      } else {
        document.getElementById("modalAuth").classList.remove("hidden");
      }
    }

    function alternarModoAuth() {
      ocultarErrorAuth();
      modoRegistro = !modoRegistro;
      document.getElementById("campoNombre").classList.toggle("hidden", !modoRegistro);
      document.getElementById("authTitulo").innerText = modoRegistro ? "Crear Cuenta Cliente" : "Iniciar Sesión";
      document.getElementById("btnAuth").innerHTML = `<span>${modoRegistro ? "Registrarse" : "Ingresar"}</span>`;
      document.getElementById("btnToggleAuth").innerText = modoRegistro ? "¿Ya tienes cuenta? Inicia sesión" : "¿No tienes cuenta? Regístrate aquí";
    }

    async function procesarAuth(e) {
      e.preventDefault();
      ocultarErrorAuth();

      const tel = document.getElementById("authTelefono").value.replace(/\D/g, '').trim();
      const pwd = document.getElementById("authPassword").value.trim();
      const nom = document.getElementById("authNombre").value.trim();
      const btn = document.getElementById("btnAuth");

      if (tel.length !== 10) return mostrarErrorAuth("El teléfono debe tener 10 dígitos.");
      if (pwd.length < 4) return mostrarErrorAuth("Contraseña mínima de 4 caracteres.");
      if (modoRegistro && nom.length < 3) return mostrarErrorAuth("Escribe tu nombre completo.");

      const url = modoRegistro ? `${API_BASE}/auth/registro` : `${API_BASE}/auth/login`;
      const payload = modoRegistro ? { nombre: nom, telefono: tel, password: pwd, rol: "cliente" } : { telefono: tel, password: pwd };

      btn.disabled = true;
      btn.innerHTML = `<span>Verificando...</span>`;

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Error de inicio de sesión");

        localStorage.setItem("sesion_usuario", JSON.stringify(data));
        checkSesion();
      } catch (err) {
        mostrarErrorAuth(err.message || "Error al conectar con el servidor.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>${modoRegistro ? "Registrarse" : "Ingresar"}</span>`;
      }
    }

    function cerrarSesion() {
      localStorage.removeItem("sesion_usuario");
      location.reload();
    }

    // --- CONTROLES DE PAGO Y DINERO ---
    function setMonto(valor) {
      document.getElementById("costo_productos").value = valor.toFixed(2);
      actualizarCalculos();
    }

    function actualizarCalculos() {
      const prod = parseFloat(document.getElementById("costo_productos").value) || 0;
      document.getElementById("lblResumenProductos").innerText = "$" + prod.toFixed(2);
      document.getElementById("lblResumenTotal").innerText = "$" + (35.00 + prod).toFixed(2);
    }

    function setMetodoPago(metodo) {
      metodoPagoSeleccionado = metodo;
      const btnE = document.getElementById("btnPagoEfectivo");
      const btnS = document.getElementById("btnPagoSPEI");

      if (metodo === 'efectivo') {
        btnE.className = "py-2 px-3 text-xs font-bold rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-900 flex items-center justify-center gap-1.5 transition";
        btnS.className = "py-2 px-3 text-xs font-medium rounded-xl border border-slate-200 bg-white text-slate-600 flex items-center justify-center gap-1.5 transition";
      } else {
        btnS.className = "py-2 px-3 text-xs font-bold rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-900 flex items-center justify-center gap-1.5 transition";
        btnE.className = "py-2 px-3 text-xs font-medium rounded-xl border border-slate-200 bg-white text-slate-600 flex items-center justify-center gap-1.5 transition";
      }
    }

    // --- MAPA LEAFLET CON PIN CENTRAL ---
    const CENTRO_VILLA = [19.8828, -98.8208];
    const LIMITES_MUNICIPIO = [
      [19.8200, -98.8800],
      [19.9500, -98.7500]
    ];
    let map;
    let coordsDestino = { lat: CENTRO_VILLA[0], lng: CENTRO_VILLA[1] };

    function initMap() {
      map = L.map('mapa', {
        maxBounds: LIMITES_MUNICIPIO,
        maxBoundsViscosity: 1.0,
        minZoom: 13
      }).setView(CENTRO_VILLA, 16);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // Al mover el mapa, las coordenadas del centro se actualizan automáticamente
      map.on('move', () => {
        const c = map.getCenter();
        coordsDestino = { lat: c.lat, lng: c.lng };
      });
    }

    function obtenerMiUbicacion() {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          map.setView([lat, lng], 17);
          coordsDestino = { lat, lng };
          document.getElementById("destino_ref").value = "Mi ubicación GPS";
        },
        () => alert("Enciende el GPS de tu celular y acepta los permisos."),
        { enableHighAccuracy: true }
      );
    }

    async function enviarPedido(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;

      const payload = {
        cliente_id: usuarioActual.id,
        cliente_nombre: usuarioActual.nombre,
        cliente_telefono: usuarioActual.telefono,
        descripcion: document.getElementById("descripcion").value.trim(),
        origen_direccion: "Comercio local (Villa de Tezontepec)",
        origen_lat: CENTRO_VILLA[0],
        origen_lng: CENTRO_VILLA[1],
        destino_direccion: document.getElementById("destino_ref").value.trim(),
        destino_lat: coordsDestino.lat,
        destino_lng: coordsDestino.lng,
        costo_productos: parseFloat(document.getElementById("costo_productos").value) || 0,
        metodo_pago: metodoPagoSeleccionado,
        tipo: "mandado_express"
      };

      try {
        const res = await fetch(`${API_BASE}/pedidos/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Error al enviar el pedido");

        document.getElementById("formMandado").reset();
        setMonto(0);
        await cargarPedidos();
      } catch (err) {
        alert(err.message || "Error al conectar con el servidor.");
      } finally {
        btn.disabled = false;
      }
    }

    async function cargarPedidos() {
      if (!usuarioActual) return;
      const cont = document.getElementById("contenedorPedidos");
      try {
        const res = await fetch(`${API_BASE}/pedidos/`);
        const data = await res.json();
        const misPedidos = data.filter(p => p.cliente_id === usuarioActual.id).reverse();

        if (misPedidos.length === 0) {
          cont.innerHTML = `<p class="text-xs text-slate-400 text-center py-4 font-medium">No tienes mandados activos.</p>`;
          return;
        }

        const badges = {
          'buscando_repartidor': 'bg-amber-100 text-amber-800',
          'asignado': 'bg-blue-100 text-blue-800',
          'en_camino': 'bg-purple-100 text-purple-800',
          'entregado': 'bg-emerald-100 text-emerald-800'
        };

        cont.innerHTML = misPedidos.map(p => {
          let contactoRepartidor = "";
          if (p.repartidor_telefono) {
            contactoRepartidor = `
              <div class="mt-2.5 p-2.5 bg-emerald-50 border border-emerald-200 rounded-xl text-xs space-y-1.5">
                <div class="flex items-center gap-1.5 text-emerald-900 font-bold text-[11px]">
                  <i data-lucide="bike" class="w-4 h-4 text-emerald-600"></i>
                  Repartidor: ${p.repartidor_nombre}
                </div>
                <div class="flex gap-2 pt-0.5">
                  <a href="tel:${p.repartidor_telefono}" class="flex-1 py-1.5 bg-emerald-600 text-white rounded-lg text-center font-bold flex items-center justify-center gap-1 active:scale-95 transition">
                    <i data-lucide="phone" class="w-3.5 h-3.5"></i> Llamar
                  </a>
                  <a href="https://wa.me/52${p.repartidor_telefono}" target="_blank" class="flex-1 py-1.5 bg-emerald-500 text-white rounded-lg text-center font-bold flex items-center justify-center gap-1 active:scale-95 transition">
                    <i data-lucide="message-circle" class="w-3.5 h-3.5"></i> WhatsApp
                  </a>
                </div>
              </div>`;
          }

          return `
            <div class="border border-slate-200 rounded-2xl p-3.5 bg-white shadow-sm space-y-2 text-xs">
              <div class="flex justify-between items-center font-bold">
                <span class="text-[10px] px-2.5 py-0.5 rounded-full font-bold uppercase ${badges[p.estado] || 'bg-slate-100 text-slate-700'}">
                  ${p.estado.replace('_', ' ')}
                </span>
                <span class="text-slate-800 font-extrabold">Total: $${(Number(p.costo_envio) + Number(p.costo_productos)).toFixed(2)}</span>
              </div>
              <p class="font-semibold text-slate-800">${p.descripcion}</p>
              <div class="text-[11px] text-slate-500">
                <b>Entrega:</b> ${p.destino_direccion}
              </div>
              ${contactoRepartidor}
            </div>`;
        }).join("");

        if (window.lucide) lucide.createIcons();
      } catch (err) {
        cont.innerHTML = `<p class="text-xs text-rose-500 text-center font-medium">Error al actualizar pedidos.</p>`;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      initMap();
      checkSesion();
      if (window.lucide) lucide.createIcons();
      setInterval(cargarPedidos, 5000);
    });
  </script>
</body>
</html>
